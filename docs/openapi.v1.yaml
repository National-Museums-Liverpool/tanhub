openapi: 3.1.0
info:
  title: Tanhub API
  version: 1.0.0
  description: >-
    Machine-readable specification for the tanhub read-only REST API. Keep this
    specification consistent with the canonical human-readable reference in api.md.
    Taxa return exclude_from_rarity_calculations (boolean) and
    exclude_from_rarity_calculations_comment (nullable string) from their assigned species.
    Descendants inherit these effective values; taxa without an assigned species return false/null.
    Occurrences, taxon names, taxon stats and yearly taxon stats expose the same values with a
    taxon__ prefix only with include=taxon. Existing requests are unfiltered unless clients opt in.
    Exclusion affects square rarity scores, not counts, measured categories or expert rarity status.
    Staff flag transitions prioritise an asynchronous square-statistics rebuild.
    Taxa return gb_red_list and gb_status as nullable strings of distinct, bytewise-sorted
    designation abbreviations separated by semicolons without spaces. Included taxa on
    occurrences, taxon names, taxon stats and yearly taxon stats use taxon__gb_red_list and
    taxon__gb_status with include=taxon. Old and provisional types are included within the
    GB Red List and GB Status warehouse categories. Equality/in compare whole lists;
    contains is substring matching, not exact membership. Sorting is lexical over whole lists.
    This replaces conservation_status and taxon__conservation_status without legacy aliases.
servers:
  - url: /api/v1
    description: API v1
x-tanhub-configured-attribute-filters:
  resources: [taxa, taxon-names, occurrences, taxon-stats, taxon-year-stats]
  queryNamePattern: '^attribute__[a-z][a-z0-9_]{0,62}$'
  description: >-
    Deployment-defined keys are discovered through taxon-attributes. Related resources require
    include=taxon. Scalar equality or bracketed operators are supported: integer eq/in/gte/lte,
    term eq/in with stable indicia:<id> keys. eq=null matches absence, never zero, and cannot
    combine with other predicates. Alternatives match OR, attributes match AND, and numeric bounds
    match one assignment. in accepts up to 100 alternatives. Unknown keys/operators, malformed
    values and reversed bounds return 400. Query-name patterns use this extension because OpenAPI
    cannot declare deployment-dependent query parameter names.
  examples:
    numeric: 'attribute__pantheon_sqs[gte]=1'
    membership: 'attribute__pantheon_habitat[in]=indicia:101,indicia:102'
  sorting: >-
    sort=attribute__<key> or -attribute__<key> supports every enabled attribute. Integer sorting
    is numeric; term sorting uses display labels under normal database collation. Multi-values use
    MIN ascending/MAX descending; single-valued attributes sort their sole retained value.
    Missing values are last in both directions. A resource-key tie-break stabilizes pages.
    Attribute hydration is optional for filtering/sorting. Values describe the exact result taxon.
security:
  - {}
  - bearerAuth: []
tags:
  - name: data-sources
  - name: geographic-regions
  - name: occurrences
  - name: recording-schemes
  - name: taxa
  - name: taxon-groups
  - name: taxon-names
  - name: taxon-ranks
  - name: grid-square-stats
  - name: taxon-stats
  - name: taxon-year-stats
  - name: taxon-attributes
  - name: taxon-attribute-terms
paths:
  /taxon-attributes:
    get:
      tags: [taxon-attributes]
      summary: Discover enabled taxon attribute definitions
      description: >-
        Exposes key, label, type (integer or term), multi_value (boolean), source_id, and nullable
        termlist_id. Only enabled definitions stored on this installation are returned.
        Scalar fields support the standard filters. Default sorting is label, with key as a
        stable tie-break. An installation with no configured attributes returns an empty list.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /taxon-attributes/{key}:
    get:
      tags: [taxon-attributes]
      summary: Get an enabled attribute definition by stable configuration key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /taxon-attribute-terms:
    get:
      tags: [taxon-attribute-terms]
      summary: Discover currently retained terms on publicly visible taxa
      description: >-
        Exposes attribute_key, key, and label for terms retained on publicly visible taxa.
        Terms are scoped by attribute, not the complete warehouse vocabulary. All exposed fields
        support the standard filters. Default sorting is label, with attribute_key and key as
        stable tie-breaks. There is no single-term endpoint.
      parameters:
        - name: attribute_key
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /data-sources:
    get:
      tags: [data-sources]
      summary: List data sources
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /data-sources/{abbr}:
    get:
      tags: [data-sources]
      summary: Get one data source
      parameters:
        - name: abbr
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /geographic-regions:
    get:
      tags: [geographic-regions]
      summary: List geographic regions
      parameters:
        - $ref: '#/components/parameters/GeographicRegionsInclude'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /geographic-regions/{higher_geography_identifier}:
    get:
      tags: [geographic-regions]
      summary: Get one geographic region
      parameters:
        - $ref: '#/components/parameters/GeographicRegionsInclude'
        - name: higher_geography_identifier
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /occurrences:
    get:
      tags: [occurrences]
      summary: List occurrences
      parameters:
        - $ref: '#/components/parameters/IncludedRarityExclusion'
        - $ref: '#/components/parameters/OccurrencesInclude'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /occurrences/{unique_key}:
    get:
      tags: [occurrences]
      summary: Get one occurrence
      parameters:
        - $ref: '#/components/parameters/OccurrencesInclude'
        - name: unique_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /recording-schemes:
    get:
      tags: [recording-schemes]
      summary: List recording schemes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /recording-schemes/{external_key}:
    get:
      tags: [recording-schemes]
      summary: Get one recording scheme
      parameters:
        - name: external_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /taxa:
    get:
      tags: [taxa]
      summary: List taxa
      parameters:
        - $ref: '#/components/parameters/RarityExclusion'
        - $ref: '#/components/parameters/TaxaInclude'
        - $ref: '#/components/parameters/ReportingOnly'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /taxa/{taxon_identifier}:
    get:
      tags: [taxa]
      summary: Get one taxon
      parameters:
        - $ref: '#/components/parameters/TaxaInclude'
        - name: taxon_identifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /taxon-groups:
    get:
      tags: [taxon-groups]
      summary: List taxon groups
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /taxon-groups/{external_key}:
    get:
      tags: [taxon-groups]
      summary: Get one taxon group
      parameters:
        - name: external_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /taxon-names:
    get:
      tags: [taxon-names]
      summary: List taxon names
      parameters:
        - $ref: '#/components/parameters/IncludedRarityExclusion'
        - $ref: '#/components/parameters/TaxonNamesInclude'
        - $ref: '#/components/parameters/ReportingOnly'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /taxon-names/{uuid}:
    get:
      tags: [taxon-names]
      summary: Get one taxon name
      parameters:
        - $ref: '#/components/parameters/TaxonNamesInclude'
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /taxon-ranks:
    get:
      tags: [taxon-ranks]
      summary: List taxon ranks
      parameters:
        - $ref: '#/components/parameters/ReportingOnly'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /taxon-ranks/{abbr}:
    get:
      tags: [taxon-ranks]
      summary: Get one taxon rank
      parameters:
        - name: abbr
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /grid-square-stats:
    get:
      tags: [grid-square-stats]
      summary: List grid square stats
      parameters:
        - $ref: '#/components/parameters/GridSquareStatsInclude'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /grid-square-stats/{uuid}:
    get:
      tags: [grid-square-stats]
      summary: Get one grid square stats row
      parameters:
        - $ref: '#/components/parameters/GridSquareStatsInclude'
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /taxon-stats:
    get:
      tags: [taxon-stats]
      summary: List taxon stats
      description: >-
        Returns global and regional taxon statistics. The frequency_trend field is nullable for
        non-species, insufficient-data, and unclear rows and ranges from 0 for the most declining
        taxa in the rank and scope to 100 for the most increasing taxon; stable taxa receive 50.
        frequency_trend_state identifies increasing, decreasing, stable, insufficient_data, or
        unclear. Responses also include key_species, key_species_comment, and
        key_species_decision_date for the current key-species decision, rationale, and decision
        date. key_species returns yes, no, or not set for a positive, negative, or unset decision.
        The comment and date describe current state; Not set clears both. Equality filters on
        key_species accept raw 1, 0, or null values, or the mapped yes, no, or not set values
        (case-insensitive). Use higher_geography_identifier[eq]=null for the separate global
        scope. For example,
        `/api/v1/taxon-stats?key_species[eq]=1&higher_geography_identifier[eq]=13` lists key
        species for active region 13. Rows for deleted regions are excluded, so the null geography
        filter selects only global rows.
        occupied_square_score and occupied_square_percentage are nullable species-only
        measurements rounded to four decimals. Scores use SQL percent-rank of positive occupied
        square counts within rarity_group_name and scope, with tied counts sharing scores and
        singletons receiving 50. All-tied larger groups receive 0; tied maxima may be below 100.
        Percentages use all mapped squares, including partial and unrecorded squares, with
        globally deduplicated coverage across active regions. Missing coverage and decision-only
        scopes have null percentages. Missing rarity groups have null scores.
        rarity_status is common, rare, or null, with rarity_status_comment and
        rarity_status_decision_date describing the current expert decision, not a history.
        Decisions do not alter measured values and do not inherit between global and regional
        scopes. All five fields support the standard filtering and sorting syntax, for example
        occupied_square_score[lte]=5, occupied_square_percentage[lte]=0.6, or rarity_status[eq]=rare.
        Use the taxon_rank query filter, such as taxon_rank=species, when reviewing one level.
      parameters:
        - $ref: '#/components/parameters/TaxonStatsInclude'
        - $ref: '#/components/parameters/IncludedRarityExclusion'
        - $ref: '#/components/parameters/ReportingOnly'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /taxon-stats/{uuid}:
    get:
      tags: [taxon-stats]
      summary: Get one taxon stats row
      description: >-
        Includes frequency_trend and frequency_trend_state when available. The score is nullable
        for non-species, insufficient-data, and unclear rows and ranges from 0 to 100, with stable
        taxa represented by 50. Use taxon_rank=species, or another rank, to review one level.
      parameters:
        - $ref: '#/components/parameters/TaxonStatsInclude'
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /taxon-year-stats:
    get:
      tags: [taxon-year-stats]
      summary: List taxon year stats
      parameters:
        - $ref: '#/components/parameters/TaxonYearStatsInclude'
        - $ref: '#/components/parameters/IncludedRarityExclusion'
        - $ref: '#/components/parameters/ReportingOnly'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /taxon-year-stats/{uuid}:
    get:
      tags: [taxon-year-stats]
      summary: Get one taxon year stats row
      parameters:
        - $ref: '#/components/parameters/TaxonYearStatsInclude'
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/ItemResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /auth/token:
    post:
      summary: Obtain an access and refresh token pair
      description: >-
        Accepts the account email address in username and the account password.
        Returns opaque CodeIgniter Shield bearer tokens, not JWTs. The access token lasts
        3600 seconds; the refresh token lasts 30 days. Missing credentials return 400;
        invalid credentials return 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          $ref: '#/components/responses/Problem'
  /auth/token/refresh:
    post:
      summary: Rotate a refresh token and issue a new token pair
      description: >-
        Revokes the submitted refresh token and returns a new access/refresh pair.
        Save the replacement refresh token for the next refresh. Missing refresh_token
        returns 400; invalid, expired, or already-used refresh tokens return 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          $ref: '#/components/responses/Problem'
  /auth/token/revoke:
    post:
      summary: Revoke access or refresh tokens
      description: >-
        Revokes either or both tokens supplied in the JSON body. If neither field is supplied,
        revokes the bearer token in the Authorization header instead. Returns 204 with no body,
        including for unknown or already-revoked tokens. No authentication is required.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeTokenRequest'
      responses:
        '204':
          description: Token revoked
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Optional opaque CodeIgniter Shield access token. Valid bearer tokens select the
        authenticated rate-limit allowance, not additional data access. Missing or invalid
        tokens on data requests use the anonymous allowance.
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size, default 1000, minimum 1, maximum 10000.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1000
    Offset:
      name: offset
      in: query
      description: Zero-based offset.
      schema:
        type: integer
        minimum: 0
        default: 0
    RarityExclusion:
      name: exclude_from_rarity_calculations
      in: query
      description: >-
        Opt-in effective species exclusion filter for taxa. Equality accepts true/false or 1/0;
        other values or operators return 400. Bracketed [eq] syntax is also supported.
        The nullable rationale field supports normal string filtering.
      schema:
        type: boolean
    IncludedRarityExclusion:
      name: taxon__exclude_from_rarity_calculations
      in: query
      description: >-
        Requires include=taxon. Filters the effective owning-species exclusion, including on
        descendants. Equality accepts true/false or 1/0; other values/operators return 400.
        The nullable taxon__exclude_from_rarity_calculations_comment supports string filtering.
      schema:
        type: boolean
    Sort:
      name: sort
      in: query
      description: >-
        Sort fields, e.g. sort=field,-other_field. Taxon-related resources also accept
        attribute__<configured-key>; see x-tanhub-configured-attribute-filters.
      schema:
        type: string
    ReportingOnly:
      name: reporting_only
      in: query
      description: >-
        Restrict taxon ranks, taxa, names, and statistics to configured reporting ranks. Defaults
        to true; use false (or 0) to expose all ranks. This parameter applies to list endpoints;
        single-resource lookups return the requested record regardless of reporting status. It
        does not alter occurrence results, which always retain exact taxon identity.
      schema:
        type: boolean
        default: true
    GeographicRegionsInclude:
      name: include
      in: query
      description: Comma-separated related fields to include. Supported value is data-source.
      schema:
        type: string
        example: data-source
    OccurrencesInclude:
      name: include
      in: query
      description: >-
        Comma-separated related fields to include. Supported values are data-source,
        geographic-region, grid-square-stats, taxon, taxon-name, taxon-media,
        taxon-rank, taxon-group, parent-taxon, parent-taxa, taxon-attributes.
        taxon-media, taxon-rank, taxon-group, parent-taxon, parent-taxa and taxon-attributes
        require taxon.
      schema:
        type: string
        example: taxon,taxon-media,grid-square-stats
    TaxaInclude:
      name: include
      in: query
      description: >-
        Comma-separated related fields to include. Supported values are
        parent-taxon, parent-taxa, recording-scheme, taxon-media, taxon-group, taxon-rank,
        taxon-attributes.
      schema:
        type: string
        example: taxon-media,taxon-group
    TaxonNamesInclude:
      name: include
      in: query
      description: >-
        Comma-separated related fields to include. Supported values are
        parent-taxon, parent-taxa, taxon, taxon-media, taxon-group, taxon-rank.
        taxon-attributes is also supported and requires taxon.
      schema:
        type: string
        example: taxon,taxon-media
    GridSquareStatsInclude:
      name: include
      in: query
      description: Comma-separated related fields to include. Supported value is geographic-region.
      schema:
        type: string
        example: geographic-region
    TaxonStatsInclude:
      name: include
      in: query
      description: >-
        Comma-separated related fields to include. Supported values are
        geographic-region, taxon, taxon-media, taxon-rank, taxon-group,
        parent-taxon, parent-taxa, taxon-attributes. taxon-media, taxon-rank, taxon-group,
        parent-taxon, parent-taxa and taxon-attributes require taxon.
      schema:
        type: string
        example: taxon,taxon-media,geographic-region
    TaxonYearStatsInclude:
      name: include
      in: query
      description: >-
        Comma-separated related fields to include. Supported values are
        geographic-region, taxon, taxon-media, taxon-rank, taxon-group,
        parent-taxon, parent-taxa, taxon-attributes. taxon-media, taxon-rank, taxon-group,
        parent-taxon, parent-taxa and taxon-attributes require taxon.
      schema:
        type: string
        example: taxon,taxon-media,geographic-region
  responses:
    ListResponse:
      description: Paginated list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListEnvelope'
    ItemResponse:
      description: Single item response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceItem'
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ListEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'
    PaginationMeta:
      type: object
      required: [limit, offset, count, total]
      properties:
        limit:
          type: integer
        offset:
          type: integer
        count:
          type: integer
        total:
          type: integer
    PaginationLinks:
      type: object
      required: [self, next, prev]
      properties:
        self:
          type: string
        next:
          type:
            - string
            - 'null'
        prev:
          type:
            - string
            - 'null'
    ResourceItem:
      type: object
      additionalProperties: true
      description: Generic placeholder resource schema for the starter contract.
      properties:
        taxon_attributes:
          $ref: '#/components/schemas/TaxonAttributeValues'
        gb_red_list:
          $ref: '#/components/schemas/GbDesignationList'
        gb_status:
          $ref: '#/components/schemas/GbDesignationList'
        taxon__gb_red_list:
          $ref: '#/components/schemas/GbDesignationList'
        taxon__gb_status:
          $ref: '#/components/schemas/GbDesignationList'
    TaxonAttributeValues:
      type: object
      description: >-
        Present only with include=taxon-attributes; related resources also require taxon.
        Every configured key maps to an array, even for single-valued definitions (zero/one item).
        Missing is []; empty configuration is {}. Integer arrays contain numbers; term arrays
        contain key/label objects. No parent/child inheritance or contributing-taxa union.
      additionalProperties:
        anyOf:
          - type: array
            items:
              type: integer
          - type: array
            items:
              $ref: '#/components/schemas/TaxonAttributeTerm'
    TaxonAttributeTerm:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          pattern: '^indicia:[1-9][0-9]*$'
        label:
          type: string
    TaxonAttributeDefinition:
      type: object
      required: [key, label, type, multi_value, source_id, termlist_id]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [integer, term]
        multi_value:
          type: boolean
        source_id:
          type: integer
        termlist_id:
          type: [integer, 'null']
    GbDesignationList:
      type: [string, 'null']
      description: >-
        Present on taxa, or with a taxon__ prefix only for include=taxon on related resources.
        Distinct designation abbreviations, sorted bytewise and semicolon-separated.
        Null means no available abbreviations. Equality/in compare the entire string;
        contains matches substrings rather than exact members. Old/provisional types are included.
      examples: ['LC;VU', 'Na;Nb', null]
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    TokenRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Account email address.
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    RevokeTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
        access_token:
          type: string
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
